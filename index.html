<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - أ. مقبل الزهراني</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --success: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 700px; text-align: center; border-top: 8px solid var(--primary); }
        .header { margin-bottom: 25px; }
        .header h1 { margin: 0; color: var(--primary); font-size: 28px; }
        .header p { margin: 5px 0; color: #7f8c8d; font-weight: bold; }
        .controls { background: #f8f9fa; padding: 15px; border-radius: 12px; display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 20px; }
        select, button { padding: 12px 20px; border-radius: 10px; border: 2px solid #ddd; font-size: 16px; outline: none; }
        button { background: var(--success); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover:not(:disabled) { background: #219150; transform: translateY(-2px); }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #wheel-container { position: relative; width: 400px; height: 400px; margin: 20px auto; }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid #e74c3c; z-index: 10; }
        #winner-area { margin-top: 20px; height: 60px; }
        #winner-text { font-size: 32px; font-weight: bold; color: var(--accent); }
        .count-badge { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-size: 14px; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <h1>🎡 استراتيجية عجلة الحظ</h1>
        <p>مدرسة عروة بن الزبير - المهارات الرقمية</p>
    </div>

    <div class="controls">
        <label>اختر الفصل:</label>
        <select id="classSelect" onchange="loadClassData()">
            <option value="">-- اختر من القائمة --</option>
            <option value="1">فصل 6-1</option>
            <option value="2">فصل 6-2</option>
            <option value="3">فصل 6-3</option>
            <option value="4">فصل 6-4</option>
            <option value="5">فصل 6-5</option>
            <option value="6">فصل 6-6</option>
            <option value="7">فصل 6-7</option>
            <option value="8">فصل 6-8</option>
        </select>
        <button id="spinBtn" onclick="spin()" disabled>تدوير العجلة</button>
    </div>

    <div id="wheel-container">
        <div id="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <div id="winner-area">
        <div id="winner-text"></div>
        <div id="countDisplay" class="count-badge" style="display:none"></div>
    </div>
</div>

<script>
    // --- الإعدادات الخاصة بك ---
    const SHEET_ID = '1zSccmM1FinkU12yOGa7N14Ba-e5TCbnsEA6xyxqmtFc';
    // -------------------------

    let names = [];
    let isSpinning = false;

    async function loadClassData() {
        const sheetName = document.getElementById('classSelect').value;
        if (!sheetName) return;

        document.getElementById('winner-text').innerText = "جاري التحميل...";
        
        // جلب البيانات من صفحة محددة (العمود الأول فقط)
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
        
        try {
            const resp = await fetch(url);
            const csvText = await resp.text();
            
            Papa.parse(csvText, {
                complete: function(results) {
                    // نأخذ العمود الأول ونحذف القيم الفارغة والعناوين
                    names = results.data.map(row => row[0])
                                       .filter(n => n && n.trim() !== "" && n !== "الاسم" && n !== "اسم الطالب");
                    
                    if (names.length > 0) {
                        document.getElementById('winner-text').innerText = "";
                        updateUI();
                        draw(0);
                    } else {
                        alert("لم يتم العثور على أسماء في هذه الصفحة");
                    }
                }
            });
        } catch (e) {
            alert("تأكد من أن ملف الشيت (متاح لأي شخص لديه الرابط)");
        }
    }

    function updateUI() {
        const countDiv = document.getElementById('countDisplay');
        countDiv.style.display = 'inline-block';
        countDiv.innerText = `الأسماء المتبقية: ${names.length}`;
        document.getElementById('spinBtn').disabled = names.length === 0;
    }

    function draw(angle) {
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const sections = names.length || 1;
        const arc = 2 * Math.PI / sections;

        ctx.clearRect(0, 0, 500, 500);
        names.forEach((name, i) => {
            ctx.beginPath();
            ctx.fillStyle = `hsl(${(i * 360 / sections)}, 70%, 55%)`;
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 240, i * arc + angle, (i + 1) * arc + angle);
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(i * arc + arc / 2 + angle);
            ctx.fillStyle = "white";
            ctx.font = "bold 18px Segoe UI";
            ctx.textAlign = "right";
            ctx.fillText(name.substring(0, 15), 210, 8);
            ctx.restore();
        });
    }

    function spin() {
        if (isSpinning || names.length === 0) return;
        isSpinning = true;
        document.getElementById('spinBtn').disabled = true;
        document.getElementById('winner-text').innerText = "انتظر...";

        let duration = 4000;
        let totalRotation = 1440 + Math.random() * 1800; 
        let start = null;

        function animate(timestamp) {
            if (!start) start = timestamp;
            let progress = timestamp - start;
            let p = progress / duration;
            let easeOut = 1 - Math.pow(1 - p, 4);
            let currentAngle = (totalRotation * easeOut) * (Math.PI / 180);
            draw(currentAngle);
            if (progress < duration) requestAnimationFrame(animate);
            else finalize(currentAngle);
        }
        requestAnimationFrame(animate);
    }

    function finalize(angle) {
        isSpinning = false;
        const sections = names.length;
        const arc = 2 * Math.PI / sections;
        let normalized = angle % (2 * Math.PI);
        let index = Math.floor(sections - (normalized / arc)) % sections;
        
        const winner = names[index];
        document.getElementById('winner-text').innerText = "⭐ " + winner + " ⭐";
        
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

        // حذف الاسم فوراً
        names.splice(index, 1);
        setTimeout(() => {
            updateUI();
            draw(0);
        }, 2500);
    }
</script>
</body>
</html>
