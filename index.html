<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ المطورة - أ. مقبل الزهراني</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --success: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 95%; max-width: 850px; text-align: center; border-top: 8px solid var(--primary); }
        .header { margin-bottom: 25px; }
        .header h1 { margin: 0; color: var(--primary); font-size: 32px; }
        .controls { background: #f8f9fa; padding: 20px; border-radius: 12px; display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 20px; }
        select, button { padding: 12px 25px; border-radius: 10px; border: 2px solid #ddd; font-size: 18px; outline: none; }
        button { background: var(--success); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover:not(:disabled) { background: #219150; transform: scale(1.05); }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        
        /* تكبير حاوية العجلة */
        #wheel-container { position: relative; width: 550px; height: 550px; margin: 30px auto; }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        #pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-top: 45px solid #e74c3c; z-index: 10; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.2)); }
        #winner-text { font-size: 42px; font-weight: bold; color: var(--accent); margin-top: 20px; min-height: 50px; }
        .count-badge { background: var(--primary); color: white; padding: 8px 20px; border-radius: 20px; font-size: 16px; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <h1>🎡 استراتيجية عجلة الحظ</h1>
        <p>مدرسة عروة بن الزبير - المهارات الرقمية</p>
    </div>

    <div class="controls">
        <label>الفصل:</label>
        <select id="classSelect" onchange="loadClassData()">
            <option value="">-- اختر الفصل --</option>
            <option value="1">فصل 6-1</option>
            <option value="2">فصل 6-2</option>
            <option value="3">فصل 6-3</option>
            <option value="4">فصل 6-4</option>
            <option value="5">فصل 6-5</option>
            <option value="6">فصل 6-6</option>
            <option value="7">فصل 6-7</option>
            <option value="8">فصل 6-8</option>
        </select>
        <button id="spinBtn" onclick="spin()" disabled>تدوير العجلة</button>
    </div>

    <div id="wheel-container">
        <div id="pointer"></div>
        <canvas id="wheelCanvas" width="800" height="800"></canvas>
    </div>

    <div id="winner-text"></div>
    <div id="countDisplay" class="count-badge" style="display:none"></div>
</div>

<script>
    const SHEET_ID = '1zSccmM1FinkU12yOGa7N14Ba-e5TCbnsEA6xyxqmtFc';
    let names = [];
    let isSpinning = false;
    let lastSoundIndex = -1;

    // صوت التكتكة
    const tickSound = new Audio('https://www.soundjay.com/buttons/button-09.mp3');

    async function loadClassData() {
        const sheetName = document.getElementById('classSelect').value;
        if (!sheetName) return;
        document.getElementById('winner-text').innerText = "جاري التحميل...";
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
        
        try {
            const resp = await fetch(url);
            const csvText = await resp.text();
            Papa.parse(csvText, {
                complete: function(results) {
                    names = results.data.map(row => row[0])
                                       .filter(n => n && n.trim() !== "" && n !== "الاسم" && n !== "اسم الطالب");
                    if (names.length > 0) {
                        document.getElementById('winner-text').innerText = "";
                        updateUI();
                        draw(0);
                    }
                }
            });
        } catch (e) { alert("تأكد من صلاحيات الملف"); }
    }

    function updateUI() {
        const countDiv = document.getElementById('countDisplay');
        countDiv.style.display = 'inline-block';
        countDiv.innerText = `الأسماء المتبقية: ${names.length}`;
        document.getElementById('spinBtn').disabled = names.length === 0;
    }

    function draw(angle) {
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const sections = names.length || 1;
        const arc = 2 * Math.PI / sections;
        const centerX = 400, centerY = 400, radius = 380;

        ctx.clearRect(0, 0, 800, 800);
        
        // حساب الاندكس الحالي للسهم لتشغيل الصوت
        if(isSpinning) {
